aid: armis-security
name: Armis Security
description: >-
  Armis Security is an enterprise cyber exposure management and asset
  intelligence company whose cloud platform discovers, identifies, and secures
  every asset across IT, IoT, OT/ICS, IoMT, cloud, and cellular-IoT environments.
  Armis exposes a tenant-based REST API (served under /api/v1 on each customer's
  <tenant>.armis.com host) using an OAuth2 client-credentials model that exchanges
  a Client ID and Client Secret for a short-lived JWT bearer token. It publishes
  a first-party Python SDK (armis-sdk), a Go CLI (armis-cli) for CI/CD application
  security scanning, and official Model Context Protocol servers (armis-appsec-mcp
  and armis-knowledge-mcp) for agent-native security scanning and knowledge access.
  Armis maintains a public Trust Center documenting SOC 2, ISO 27001/27017/27018,
  FedRAMP, and CSA STAR posture. Surfaced originally as a bain-capital-ventures
  portfolio company and enriched by the API Evangelist pipeline.
